services:
  web:
    image: node:22-bookworm-slim
    working_dir: /workspace
    labels:
      base44.project: "SR Fits"
      base44.kind: web
      base44.port: "3000"
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - /run/base44/app.env
    volumes:
      - ./:/workspace
      - base44-node-modules:/workspace/node_modules
    command:
      - sh
      - -c
      - |
        [ -f node_modules/.package-lock.json ] || npm ci --frozen-lockfile
        exec npm run dev
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  base44-node-modules:
